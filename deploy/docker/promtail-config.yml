server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape all DFG service log files
  - job_name: dfg-logs
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/dfg/*.log

    pipeline_stages:
      # Extract log level from common patterns
      - regex:
          expression: '(?P<level>(ERROR|WARN|WARNING|INFO|DEBUG|FATAL|CRITICAL))'
      - labels:
          level:

  # Scrape Docker container logs via journal
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
