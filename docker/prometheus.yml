global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Distributed File Grid - Cluster Servers (Prometheus metrics on :9091)
  - job_name: 'dfg-cluster-servers'
    static_configs:
      - targets: 
          - 'cluster-server-1:9091'
          - 'cluster-server-2:9091'
          - 'cluster-server-3:9091'
    scrape_interval: 10s
    metrics_path: /metrics
    
  # Head Servers (Prometheus metrics on :9095)
  - job_name: 'dfg-head-servers'
    static_configs:
      - targets:
          - 'head-server-1:9095'
          - 'head-server-2:9095'
    scrape_interval: 15s
    metrics_path: /metrics
    
  # Health Checker (Prometheus metrics on :9096)
  - job_name: 'dfg-health-checker'
    static_configs:
      - targets: ['health-checker:9096']
    scrape_interval: 15s
    metrics_path: /metrics