syntax = "proto3";
package heart_beat.v1;

import "google/protobuf/timestamp.proto";

message HeartBeat {
  int32 server_id = 1;
  string ip = 2;
  optional int32 rack_id = 3;
  float cpu_usage = 4;
  float total_storage_used = 5;
  google.protobuf.Timestamp timestamp = 6;
  float ram_usage = 7;
  float disk_usage = 8;
  string network_in = 9;
  string network_out = 10;
  uint64 network_in_bytes_per_sec = 11;
  uint64 network_out_bytes_per_sec = 12;
}
